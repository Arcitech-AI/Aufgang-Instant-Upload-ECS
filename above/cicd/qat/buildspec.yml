version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPO: 615299760779.dkr.ecr.us-east-1.amazonaws.com/above20mb-file-vectorization
    IMAGE_TAG: QAT
    BUILD_CONTEXT: above

phases:
  pre_build:
    commands:
      - ECR_REGISTRY="${ECR_REPO%%/*}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build --pull --no-cache --tag "$ECR_REPO:$IMAGE_TAG" "$CODEBUILD_SRC_DIR/$BUILD_CONTEXT"
  post_build:
    commands:
      - docker push "$ECR_REPO:$IMAGE_TAG"
    finally:
      - docker logout "$ECR_REGISTRY" >/dev/null 2>&1 || true
